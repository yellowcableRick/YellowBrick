<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>YellowBrick parts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #eceeea; --panel: #ffffff; --soft: #f5f6f3; --ink: #1e2321; --muted: #59625d; --line: #d4d9d4; --line-strong: #b4bbb5;
  --brick: #f2c230; --brick-ink: #1e2321; --link: #7a5200; --focus: #7a5200; --heat-max: 62%;
  --mat: #26323b; --mat-ink: #d9e1e6;
  /* one hue per group: frame blue, joints green, base amber, drawer purple, dispenser teal */
  --c-wall: #9db4cc; --c-bar: #2f6ea6; --c-x: #5fa0dc;
  --c-clip: #3d8b57; --c-end: #6aae7c; --c-staple: #a5d4b0; --c-depth: #22603a;
  --c-tile: #c9932e;
  --c-sledbar: #5b3f99; --c-ledge: #8b6fcc; --c-sled: #c3b2f0; --c-dsled: #a98fe6; --c-usled: #9d86d9; --c-rod: #d9b62f; --c-bundle: #8a73c9;
  --c-dbase: #2e9678; --c-dext: #78c4a0; --c-dcap: #3cb8c4; --c-caddy: #b89a3a;
  --body: "Archivo", "Segoe UI", system-ui, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #151918; --panel: #1d2221; --soft: #232928; --ink: #e6eae7; --muted: #9ca6a1; --line: #323937; --line-strong: #4b5451;
    --link: #f5cd4e; --focus: #f2c230; --heat-max: 36%; --mat: #10171c; --mat-ink: #c9d3d9; color-scheme: dark; }
}
:root[data-theme="dark"] { --paper: #151918; --panel: #1d2221; --soft: #232928; --ink: #e6eae7; --muted: #9ca6a1; --line: #323937; --line-strong: #4b5451;
  --link: #f5cd4e; --focus: #f2c230; --heat-max: 36%; --mat: #10171c; --mat-ink: #c9d3d9; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 var(--body); font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a { color: var(--link); }
h2, h3 { text-wrap: balance; }
.sw { width: 11px; height: 11px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .14); }

/* ---------- shell: sidebar from 760 px, a sticky top bar below ---------- */
.app { min-height: 100vh; }
.side { background: var(--paper); z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.brand b { font-weight: 720; font-stretch: 118%; font-size: 17px; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.2; }
.mark { width: 26px; height: 14px; border-radius: 3px; flex: none; background: linear-gradient(90deg, transparent calc(50% - .5px), rgb(0 0 0 / .28) calc(50% - .5px) calc(50% + .5px), transparent 0) var(--brick); }
nav summary { display: none; }
.find { position: relative; margin: 14px 0 6px; }
.find input { width: 100%; font: inherit; font-size: 14.5px; color: var(--ink); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 8px; height: 36px; padding: 0 30px 0 10px; }
.find input::placeholder { color: var(--muted); }
.find input::-webkit-search-cancel-button { cursor: pointer; }
.find kbd { position: absolute; right: 8px; top: 8px; font: 500 12px/18px var(--body); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; pointer-events: none; }
.find input:focus + kbd, .find input:not(:placeholder-shown) + kbd { display: none; }
.jump { list-style: none; margin: 6px 0 4px; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.jump a { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--brick); background: color-mix(in srgb, var(--brick) 14%, var(--panel)); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 550; line-height: 1.25; }
.jump a:hover { background: color-mix(in srgb, var(--brick) 30%, var(--panel)); }
.none { margin: 8px 4px; font-size: 13.5px; color: var(--muted); }
#list h3 { margin: 16px 9px 4px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
#list h3:first-child { margin-top: 8px; }
#list h2.sec { margin: 20px 4px 2px; font-size: 15.5px; font-weight: 700; font-stretch: 110%; }
#list h2.sec:first-child { margin-top: 6px; }
#list h2.sec a { display: block; padding: 4px 5px; color: var(--ink); background: none; font-size: inherit; }
#list h2.sec a:hover { text-decoration: underline; }
#list h2.sec a[aria-current="page"] { background: var(--brick); color: var(--brick-ink); }
#list h2.sec + h3 { margin-top: 4px; }
.row a.wide b { display: flex; align-items: center; gap: 8px; }
#list ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
#list a { display: flex; align-items: center; gap: 9px; padding: 5px 9px; border-radius: 7px; text-decoration: none; color: var(--ink); font-size: 14.5px; line-height: 1.3; font-stretch: 96%; }
#list a:hover { background: var(--panel); }
#list a[aria-current="page"] { background: var(--brick); color: var(--brick-ink); font-weight: 650; }
#list a em { margin-left: auto; padding-left: 6px; font-style: normal; color: var(--muted); font-size: 12.5px; font-weight: 450; white-space: nowrap; }
#list a[aria-current="page"] em { color: rgb(30 35 33 / .72); }
@media (min-width: 760px) {
  .app { display: grid; grid-template-columns: clamp(212px, 20vw, 256px) minmax(0, 1fr); }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; padding: 18px 10px 28px 14px; border-right: 1px solid var(--line); }
  .brand { padding: 0 4px; }
}
@media (min-width: 760px) and (max-width: 1099px) { #list a em { display: none; } #list a { padding: 4px 8px; font-size: 14px; } #list h3 { margin: 11px 8px 2px; } .find { margin: 12px 0 4px; } }
@media (pointer: coarse) { .find kbd { display: none; } }
@media (max-width: 759px) {
  .side { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .brand small { display: none; }
  .brand b { font-size: 16px; }
  nav { flex: 1; min-width: 0; }
  nav summary { display: flex; align-items: center; gap: 9px; list-style: none; cursor: pointer; min-height: 42px; padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel); font-weight: 600; font-size: 15px; line-height: 1.2; }
  nav summary::-webkit-details-marker { display: none; }
  nav summary .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav summary .at { color: var(--muted); font-weight: 450; white-space: nowrap; }
  @media (max-width: 479px) { nav summary .at { display: none; } }
  nav summary::after { content: ""; margin-left: auto; flex: none; width: 8px; height: 8px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: translateY(-2px) rotate(45deg); }
  nav details[open] summary::after { transform: translateY(2px) rotate(-135deg); }
  .navbody { position: absolute; left: 0; right: 0; top: 100%; max-height: calc(100vh - 60px); max-height: calc(100dvh - 60px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--paper); border-bottom: 1px solid var(--line); box-shadow: 0 18px 30px -12px rgb(0 0 0 / .35); padding: 0 10px 14px; }
  .find { margin-top: 10px; }
  .find input { height: 44px; font-size: 16px; }
  #list ul { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #list a { min-height: 44px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); font-size: 14.5px; }
  #list a em { display: none; }
  .jump a { min-height: 44px; }
}

/* ---------- content ---------- */
main { padding: 22px 24px 56px; max-width: 1120px; min-width: 0; }
main > section { display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; flex-direction: column; gap: 4px; }
.head h2 { margin: 0; font-size: 28px; line-height: 1.12; font-weight: 700; font-stretch: 112%; letter-spacing: -0.012em; }
.lede { margin: 2px 0 0; color: var(--muted); max-width: 68ch; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; color: var(--link); text-decoration: none; font-size: 14px; font-weight: 550; padding: 2px 0; }
.back::before { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 0 2px 2px; transform: rotate(45deg); }
.back:hover { text-decoration: underline; }
.about { max-width: 68ch; margin-top: 6px; }
.about h3 { margin: 0 0 4px; font-size: 15px; font-weight: 650; }
.about p { margin: 0; color: var(--muted); }
@media (max-width: 759px) { main { padding: 16px 10px 40px; } .head h2 { font-size: 23px; } }

/* legend of a size table */
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.key { flex: none; display: inline-grid; place-items: center; min-width: 38px; height: 26px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line-strong); background: color-mix(in oklch, var(--brick) calc(.6 * var(--heat-max)), var(--soft)); color: var(--ink); font-weight: 650; font-size: 13.5px; font-stretch: 94%; white-space: nowrap; }
.key.ramp { min-width: 54px; background: linear-gradient(90deg, color-mix(in oklch, var(--brick) calc(.2 * var(--heat-max)), var(--soft)), color-mix(in oklch, var(--brick) var(--heat-max), var(--soft))); }
.key.no { background: none; border-style: dashed; color: var(--muted); font-weight: 400; }

/* size table: rows x columns, each cell opens that model */
.tt { margin: 8px 0 -4px; font-size: 17px; font-weight: 650; font-stretch: 106%; }
.tt span { font-weight: 400; font-size: 14px; color: var(--muted); font-stretch: 100%; margin-left: 8px; }
.matrix { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px 6px; container-type: inline-size; }
.matrix table { border-collapse: separate; border-spacing: 4px; width: 100%; max-width: calc(3.6em + 26px + var(--cols, 9) * 92px); table-layout: fixed; }
.matrix col.c-y { width: 22px; } .matrix col.c-rh { width: 2.4em; }
.matrix th { font-weight: 550; color: var(--muted); font-size: 13.5px; padding: 0; border-radius: 5px; }
.matrix thead .axx th { text-align: left; color: var(--ink); font-weight: 600; font-size: 13px; padding: 0 2px 2px; }
.matrix thead .axx th span, .matrix .axy span { color: var(--muted); font-weight: 450; }
.matrix th.axy { vertical-align: top; padding-top: 6px; }
.matrix th.axy > div { writing-mode: vertical-rl; color: var(--ink); font-weight: 600; font-size: 13px; white-space: nowrap; margin: 0 auto; }
.matrix th.hx { color: var(--brick-ink); background: var(--brick); }
.matrix td { padding: 0; }
.matrix td a { display: grid; place-items: center; height: 46px; border-radius: 7px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); text-decoration: none; line-height: 1.05; text-align: center; }
.matrix td a[style] { background: color-mix(in oklch, var(--brick) calc(var(--h) * var(--heat-max)), var(--soft)); border-color: color-mix(in oklch, var(--brick) calc(var(--h) * var(--heat-max)), var(--line)); }
.matrix td a b { font-weight: 650; font-size: 15px; font-stretch: 92%; white-space: nowrap; }
.matrix td a.plain b { font-weight: 500; color: var(--muted); }
.matrix td a.two b i { font-style: normal; }
.matrix td a:hover { border-color: var(--ink); }
.matrix td a:hover b { color: var(--ink); }
.matrix td a.here { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
.matrix td.no { text-align: center; color: var(--line-strong); font-size: 13px; }
@container (max-width: 560px) {
  .matrix table { border-spacing: 3px; }
  .matrix col.c-y { width: 20px; } .matrix col.c-rh { width: 1.7em; }
  .matrix th.axy > div { font-size: 12px; }
  .matrix th { font-size: 12.5px; }
  .matrix td a { height: 44px; padding: 0 1px; }
  .matrix td a b { font-size: 14px; }
}
@container (max-width: 700px) { .matrix td a.two b i { display: block; } }
@container (max-width: 400px) {
  .matrix table { border-spacing: 2px; }
  .matrix td a { border-radius: 6px; }
  .matrix td a b { font-size: 13px; letter-spacing: -0.02em; }
}
/* lists of sizes or kinds, for one-axis and variant parts */
.row { display: flex; flex-wrap: wrap; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.row a { display: grid; place-items: center; min-width: 76px; min-height: 52px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); text-decoration: none; line-height: 1.2; text-align: center; }
.row a b { font-weight: 650; font-size: 15px; }
.row a span { color: var(--muted); font-size: 12.5px; }
.row a:hover { border-color: var(--ink); }
.row a.here { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
.row a.wide { flex: 1 1 220px; max-width: 340px; justify-items: start; text-align: left; padding: 10px 14px; }
.row a.wide span { font-size: 13px; }

/* ---------- model ---------- */
#v-model { container: mv / inline-size; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.viewer { min-width: 0; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; padding: 9px 12px 10px; }
.ctl label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--muted); }
.ctl select { font: inherit; font-size: 15px; color: var(--ink); background: var(--soft); border: 1px solid var(--line-strong); border-radius: 7px; height: 36px; padding: 0 6px; min-width: 4.8em; max-width: 100%; }
.ctl select.wide { max-width: min(100%, 22em); }
.ctl .grp { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: end; }
.ctl .ex input { width: 130px; accent-color: var(--brick); margin: 0; height: 36px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; height: 34px; padding: 0 12px; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-checked="true"] { background: var(--brick); color: var(--brick-ink); font-weight: 650; }
.seg button:focus-visible { outline-offset: -3px; }
.ctl .seglab { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--muted); }
@media (pointer: coarse) { .ctl select { height: 42px; } .seg button { height: 40px; } .ctl .ex input { height: 42px; } }

.stage { position: relative; background: var(--mat); border-radius: 12px; overflow: hidden; height: clamp(300px, 56vh, 620px); }
.ctl:not([hidden]) + .stage { border-radius: 0 0 12px 12px; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
@media (pointer: coarse) { .stage:not(.live) canvas { touch-action: pan-y pinch-zoom; } }
.msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mat-ink); pointer-events: none; text-align: center; padding: 20px; font-size: 15px; }
.msg.pill { inset: 12px auto auto 50%; transform: translateX(-50%); padding: 5px 12px; border-radius: 99px; background: rgb(0 0 0 / .45); font-size: 13px; white-space: nowrap; }
.stage::before { content: ""; position: absolute; left: 0; top: 0; height: 3px; width: 34%; background: var(--brick); opacity: 0; z-index: 2; }
.stage.loading::before { opacity: 1; animation: slide 1.15s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { .stage.loading::before { animation: none; width: 100%; opacity: .5; } }
.tools { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; }
.mbtn { font: inherit; font-size: 13px; color: var(--mat-ink); background: rgb(255 255 255 / .08); border: 1px solid rgb(255 255 255 / .2); border-radius: 7px; height: 32px; padding: 0 10px; cursor: pointer; }
.mbtn:hover { background: rgb(255 255 255 / .15); }
.mbtn[aria-pressed="true"] { background: var(--brick); color: var(--brick-ink); border-color: var(--brick); font-weight: 650; }
.mbtn:focus-visible { outline-color: var(--brick); }
#turn, .taphint { display: none; }
@media (pointer: coarse) { #turn { display: block; } .mbtn { height: 40px; padding: 0 14px; } .stage:not(.live) .taphint { display: block; } }
.taphint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); color: var(--mat-ink); font-size: 13px; opacity: .8; pointer-events: none; white-space: nowrap; }
.hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 8px; background: rgb(0 0 0 / .62); color: #fff; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .2s; }
.hint.on { opacity: 1; }
.scale { position: absolute; right: 12px; bottom: 16px; color: var(--mat-ink); font-size: 12.5px; opacity: .8; pointer-events: none; }
@media (max-width: 480px) { .scale .lg { display: none; } .stage { height: clamp(300px, 54vh, 520px); } }

.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 26px; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 16px; }
.facts div { min-width: 0; }
.facts dt { font-size: 12.5px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-size: 15px; }
.dl { margin-left: auto; display: flex; flex-direction: column; align-items: flex-start; background: var(--brick); color: var(--brick-ink); border: 0; border-radius: 9px; padding: 8px 16px; text-decoration: none; font: inherit; font-weight: 650; font-size: 15.5px; line-height: 1.3; cursor: pointer; text-align: left; }
.dl span { font-weight: 450; font-size: 12.5px; opacity: .8; word-break: break-all; }
.dl:hover { background: color-mix(in srgb, var(--brick) 86%, #000); }
.dl[disabled] { opacity: .6; cursor: progress; }
.dl:focus-visible { outline-color: var(--ink); }
.stale { opacity: .45; transition: opacity .15s; }
.facts .note { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }

.plist { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 6px; }
.plist table { width: 100%; border-collapse: collapse; }
.plist table + table { margin-top: 8px; }
.plist th, .plist td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; vertical-align: middle; }
.plist tr:last-child td { border-bottom: 0; }
.plist th { color: var(--muted); font-weight: 550; font-size: 12.5px; }
.plist thead th:first-child { color: var(--ink); font-weight: 650; font-size: 13.5px; }
.plist .n { text-align: right; white-space: nowrap; }
.plist td a.pn { color: var(--ink); text-decoration: none; display: inline-flex; gap: 8px; align-items: baseline; }
.plist td a.pn .sw { transform: translateY(1px); }
.plist td a.pn:hover { color: var(--link); text-decoration: underline; }
.stl { display: inline-grid; place-items: center; min-height: 30px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--link); text-decoration: none; font-size: 13px; font-weight: 600; }
.stl:hover { border-color: var(--link); }
@media (pointer: coarse) { .stl { min-height: 40px; padding: 0 12px; } }
.plist .x { width: 3.2em; } .plist .c { width: 4.6em; } .plist .d { width: 3.8em; }

@container mv (min-width: 860px) {
  .mgrid { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  .stage { height: clamp(380px, calc(100vh - 220px), 760px); }
  .side2 { display: flex; flex-direction: column; gap: 12px; }
  .facts { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 14px; }
  .dl { margin: 4px 0 0; align-items: stretch; }
  .plist .c { display: none; }
}
@container mv (max-width: 859px) { .side2 { display: flex; flex-direction: column; gap: 12px; } }
@container mv (max-width: 460px) {
  .facts { gap: 8px 18px; padding: 10px 12px; }
  .dl { margin-left: 0; width: 100%; }
  .plist .c { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="side">
    <a class="brand" href="#parts"><span class="mark" aria-hidden="true"></span><span><b>YellowBrick</b><small>Parts, modules, bricks · 1 BU = 32 mm</small></span></a>
    <nav aria-label="Parts and modules">
      <details id="navd" open>
        <summary id="navsum"></summary>
        <div class="navbody">
          <div class="find" role="search"><label class="vh" for="q">Find a part or size</label><input id="q" type="search" placeholder="Find, try wall 6x4" autocomplete="off" spellcheck="false"><kbd>/</kbd></div>

      + `<button type="button" class="dl" id="mstl">Download the one print<span>${M.id}_${key}.stl, without the loose ${loose.length === 1 ? "part" : "parts"}</span></button>`;
    $("mstl").onclick = () => exportSTL(M, key);
    $("plist").innerHTML = (DISP[V.data] ? dispUnits(V, key, loose, count) : table("Printed separately", loose, true)) + table("In the one print", fixed, false);
  }
  $("plist").hidden = false; ["facts", "plist"].forEach(x => { $(x).classList.remove("stale"); $(x).inert = false; });
}
function explode() { if (!modObj) return; const one = printMode === "one"; modObj.children.forEach(o => o.position.copy(o.userData.dir).multiplyScalar(one && !o.userData.loose ? 0 : explodeT)); }
function exportSTL(M, key) {
  if (!modObj || modKey !== key) return;
  const b = $("mstl"); b.disabled = true; const t0 = b.firstChild.textContent; b.firstChild.textContent = "Making the STL…";
  setTimeout(() => {
    const t = explodeT; explodeT = 0; explode();
    const g = new THREE.Group(); g.rotation.x = Math.PI / 2; const c = modObj.clone(true); c.children.filter(o => o.userData.loose).forEach(o => c.remove(o)); g.add(c); g.updateMatrixWorld(true);   // back to z up; the loose items are printed on their own
    if (!THREE.STLExporter) { b.disabled = false; b.firstChild.textContent = t0; explodeT = t; explode(); return; }
    const data = new THREE.STLExporter().parse(g, { binary: true });
    explodeT = t; explode();
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "model/stl" })); a.download = `${M.id}_${key}.stl`;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); b.disabled = false; b.firstChild.textContent = t0;
  }, 30);
}

// ---------- routing: #wall = all walls, #wall-6x4 = that model, #drawer-3x3x2 = a module ----------
let last = { id: null, model: false }, first = true;
function route() {
  const ALIAS = { "seam-full": "seam-2", "seam-end": "seam-1", "end-full": "end-2", "end-a": "end-1", "end-b": "end-1" };   // old links
  const h0 = (location.hash || "#parts").slice(1), h = ALIAS[h0] || h0, i = h.indexOf("-");
  const id = i < 0 ? h : h.slice(0, i), key = i < 0 ? null : h.slice(i + 1);
  let isModel, title;
  if (SECTIONS[h]) {
    modObj = null; curPart = h; curAt = ""; isModel = false; title = SECTIONS[h][0];
    $("v-options").hidden = false; $("v-model").hidden = true; renderOverview(h);
  } else if (MBY[id]) {
    const M = MBY[id], r = resolve(M, key);
    curPart = id; isModel = !!r; modObj = null;
    if (r) { const [w, d, hh] = r[1].split("x"); seen[id] = `${r[0].key}${w}x${d}`; curAt = `${w}×${d}×${hh}`; title = `${M.name}${r[0].name ? ", " + lc(r[0].name) : ""} ${dimsText(r[0].axes, [w, d, hh])}`; }
    else { curAt = ""; title = M.name; }
    $("v-options").hidden = isModel; $("v-model").hidden = !isModel;
    if (r) renderModule(M, r[0], r[1]); else { renderModuleOptions(M); markSeen(); }
  } else {
    modObj = null;
    const p = BY[id] || BY.wall; curPart = p.id;
    const ms = models(p), m = ms.length === 1 ? ms[0] : ms.find(x => x[0] === key);
    isModel = !!m;
    if (m && ms.length > 1) { seen[p.id] = m[0]; curAt = p.variants ? "" : m[0].replace(/^[a-z]/, "").replace(/x/g, "×"); } else curAt = "";
    title = m ? m[2] : p.name;
    $("v-options").hidden = isModel; $("v-model").hidden = !isModel;
    if (m) renderModel(p, m); else { renderOptions(p); markSeen(); }
  }
  if (document.activeElement !== q) clearFilter();
  markNav(); document.title = `${title} – YellowBrick`;
  const ae = document.activeElement, same = last.id === curPart && last.model && isModel;
  if (!same) window.scrollTo({ top: 0 });
  if (refocus) { const s = $("ctl").querySelector(`select[data-go="${refocus}"]`); refocus = null; if (s) s.focus({ preventScroll: true }); }
  else if (!first && (!ae || ae === document.body || !ae.isConnected || ae.offsetParent === null)) { const t = $(isModel ? "m-title" : "o-title"); if (t) t.focus({ preventScroll: true }); }
  last = { id: curPart, model: isModel }; first = false;
}
renderList();
window.addEventListener("hashchange", route); syncNav(); route();
</script>
