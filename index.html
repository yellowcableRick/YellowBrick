<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YellowBrick Parts</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eceeea; --panel: #ffffff; --ink: #1f2422; --muted: #5d6661; --line: #d3d8d3; --soft: #f5f6f3;
  --accent: #2b6aa0; --accent-ink: #ffffff; --mat: #26323b; --mat-ink: #d9e1e6;
  --c-wall: #b9b4a8; --c-bar: #2b6aa0; --c-x: #c2452d; --c-clip: #3c8a55; --c-depth: #2f7a4c; --c-tile: #c9932e;
  --body: "Archivo", "Segoe UI", system-ui, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161a19; --panel: #1f2423; --ink: #e6eae7; --muted: #9ba5a0; --line: #343b39; --soft: #1a1f1e;
    --accent: #6fa6d8; --accent-ink: #0d1a26; --mat: #10171c; --mat-ink: #c9d3d9; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #161a19; --panel: #1f2423; --ink: #e6eae7; --muted: #9ba5a0; --line: #343b39; --soft: #1a1f1e;
  --accent: #6fa6d8; --accent-ink: #0d1a26; --mat: #10171c; --mat-ink: #c9d3d9; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 18px 16px 40px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; }
.wrap > * { min-width: 0; }
h1 { grid-column: 1 / -1; margin: 0; font-size: 21px; font-weight: 700; font-stretch: 118%; letter-spacing: -0.01em; }
h1 small { font-weight: 450; font-stretch: 100%; color: var(--muted); font-size: 14px; margin-left: 8px; letter-spacing: 0; }
nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 15px; }
nav a:hover { background: var(--panel); }
nav a[aria-current="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
nav a em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 13px; font-weight: 450; }
.sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
main { display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 700; font-stretch: 116%; }
.head p { margin: 0; color: var(--muted); }
.back { color: var(--accent); text-decoration: none; font-size: 14px; }
.back:hover { text-decoration: underline; }
.desc { margin: 0; color: var(--muted); max-width: 70ch; }
/* option grid */
.matrix { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; }
.matrix table { border-collapse: separate; border-spacing: 6px; }
.matrix th { font-weight: 550; color: var(--muted); font-size: 13px; padding: 0 4px; white-space: nowrap; }
.matrix th.ax { text-align: left; color: var(--ink); }
.matrix td a, .row a { display: grid; place-items: center; min-width: 58px; height: 48px; padding: 4px 8px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--soft); color: var(--ink); text-decoration: none; line-height: 1.2; text-align: center; }
.matrix td a b, .row a b { font-weight: 650; font-size: 15px; }
.matrix td a span, .row a span { color: var(--muted); font-size: 11.5px; }
.matrix td a:hover, .row a:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.row a.wide { min-width: 220px; height: auto; padding: 12px 16px; justify-items: start; text-align: left; }
.row a.wide span { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
/* model */
.stage { position: relative; background: var(--mat); border-radius: 14px; overflow: hidden; height: min(66vh, 620px); min-height: 320px; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mat-ink); pointer-events: none; text-align: center; padding: 20px; }
.msg[hidden] { display: none; }
.scale { position: absolute; right: 14px; bottom: 12px; color: var(--mat-ink); font-size: 12.5px; opacity: .85; pointer-events: none; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.fact b { display: block; font-size: 19px; font-weight: 650; font-stretch: 108%; }
.fact span { color: var(--muted); font-size: 13px; }
.dl { display: flex; flex-direction: column; justify-content: center; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 14px; text-decoration: none; font-weight: 650; font-size: 17px; }
.dl span { font-weight: 400; font-size: 12.5px; opacity: .85; word-break: break-all; }
.dl:hover { filter: brightness(1.08); }
[hidden] { display: none !important; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; }
  nav ul { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  nav a { white-space: nowrap; }
  .stage { height: 56vh; }
}
@media (max-width: 720px) { .facts { grid-template-columns: 1fr 1fr; } }
</style>
</head>

  if (!b) return a[1].map(x => [String(x), `${p.id}_${x}`, `${p.name} ${x} BU`]);
  const out = []; for (const y of b[1]) for (const x of a[1]) out.push([`${x}x${y}`, `${p.id}_${x}x${y}`, `${p.name} ${x} × ${y} BU`]); return out;
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n, d) => n.toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const mm = v => fmt(v, v % 1 ? 1 : 0);
const label = (p, file) => { const s = file.split("_")[1]; return p.name + (s ? " " + s.replace("x", " × ") + " BU" : ""); };

// ---------- list ----------
let curPart = "wall", curFile = null;
function renderList() {
  document.getElementById("list").innerHTML = PARTS.map(p => { const n = models(p).length;
    return `<li><a href="#${p.id}"${p.id === curPart ? ' aria-current="true"' : ""}><span class="sw" style="background:var(${p.col})"></span>${p.name}<em>${n} ${n === 1 ? "model" : "models"}</em></a></li>`; }).join("");
}

// ---------- options ----------
function cell(p, key, big, small) { return `<a href="#${p.id}-${key}"><b>${big}</b><span>${small}</span></a>`; }
function renderOptions(p) {
  const ms = models(p), n = ms.length;
  let body;
  if (p.variants) body = `<div class="row">${p.variants.map(v => `<a class="wide" href="#${p.id}-${v[0]}"><b>${v[2]}</b><span>${v[3]}</span></a>`).join("")}</div>`;
  else if (p.axes.length === 2) {
    const [[ax, xs], [ay, ys]] = p.axes;
    body = `<div class="matrix"><table><thead><tr><th class="ax">${ay} ↓ · ${ax} →</th>${xs.map(x => `<th scope="col">${x} BU</th>`).join("")}</tr></thead><tbody>`
      + ys.map(y => `<tr><th scope="row">${y} BU</th>${xs.map(x => `<td>${cell(p, `${x}x${y}`, `${x} × ${y}`, "BU")}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>";
  } else body = `<div class="row">${p.axes[0][1].map(x => cell(p, String(x), `${x} BU`, `${mm(MAN[`${p.id}_${x}`].size[0])} mm`)).join("")}</div>`;
  document.getElementById("v-options").innerHTML = `<div class="head"><h2>${p.name}</h2><p>${n} models · choose one</p></div><p class="desc">${p.desc}</p>${body}`;
}

// ---------- 3D ----------
const host = document.getElementById("stage");
let R, S, C, O, obj = null, grid = null, want = "";
function initView() {
  if (R) return;
  R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio || 1)); host.prepend(R.domElement);
  S = new THREE.Scene(); S.background = new THREE.Color(css("--mat"));
  S.add(new THREE.HemisphereLight(0xffffff, 0x3a4650, 0.85));
  const l1 = new THREE.DirectionalLight(0xffffff, 0.75); l1.position.set(0.6, 1, 0.8); S.add(l1);
  const l2 = new THREE.DirectionalLight(0xffffff, 0.25); l2.position.set(-0.8, 0.3, -0.6); S.add(l2);
  C = new THREE.PerspectiveCamera(26, 1, 1, 20000);
  O = new THREE.OrbitControls(C, R.domElement); O.enableDamping = true; O.dampingFactor = 0.12;
  const size = () => { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; R.setSize(w, h, false); C.aspect = w / h; C.updateProjectionMatrix(); };
  new ResizeObserver(size).observe(host); size();
  (function loop() { requestAnimationFrame(loop); if (!document.getElementById("v-model").hidden) { O.update(); R.render(S, C); } })();
}
const cache = {}, loader = new THREE.GLTFLoader();
function load(file) {
  if (!cache[file]) {
    cache[file] = new Promise((res, rej) => loader.load("models/" + file + ".glb", g => res(g.scene), undefined, rej));
    cache[file].catch(() => { delete cache[file]; });
  }
  return cache[file];
}
async function showModel(p, file) {
  initView(); want = file;
  const msg = document.getElementById("msg"); msg.textContent = "Loading…"; msg.hidden = false;
  if (obj) { S.remove(obj); obj = null; } if (grid) { S.remove(grid); grid = null; }
  let scene;
  try { scene = await load(file); } catch (e) { if (want === file) msg.textContent = "This model didn't load. Check your connection and open it again."; return; }
  if (want !== file) return;
  msg.hidden = true;
  obj = scene.clone(true);
  const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(css(p.col)), roughness: 0.6, metalness: 0.02, flatShading: true });
  obj.traverse(o => { if (o.isMesh) { if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); o.material = m; } });
  S.add(obj);
  const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  const span = Math.ceil((Math.max(sz.x, sz.z) + 64) / 32) * 32;
  grid = new THREE.GridHelper(span, span / 32, 0x8696a3, 0x4a5966); grid.position.set(c.x, box.min.y - 0.5, c.z); S.add(grid);
  const r = Math.max(sz.length() / 2, 12), fov = C.fov * Math.PI / 180, dist = r / Math.sin(Math.min(fov, fov * C.aspect) / 2) * 1.08;
  O.target.copy(c); C.position.copy(c).add(new THREE.Vector3(0.95, 0.65, 1.15).normalize().multiplyScalar(dist));
  C.near = dist / 100; C.far = dist * 20; C.updateProjectionMatrix();
}
function renderModel(p, m) {
  const [key, file, name] = m, all = models(p).length, info = MAN[file];
  document.getElementById("m-head").innerHTML = (all > 1 ? `<a class="back" href="#${p.id}">All ${all} ${p.name.toLowerCase()} models</a>` : "")
    + `<h2 style="flex-basis:100%">${name}</h2><p class="desc" style="margin:0">${p.desc}</p>`;
  document.getElementById("facts").innerHTML = [
    [info.size.map(mm).join(" × ") + " mm", "size"], [fmt(info.cm3, 2) + " cm³", "volume"], [fmt(info.cm3 * 1.24, 1) + " g", "weight in PLA"]]
    .map(([b, t]) => `<div class="fact"><b>${b}</b><span>${t}</span></div>`).join("")
    + `<a class="dl" href="stl/${file}.stl" download="${file}.stl">Download STL<span>${file}.stl</span></a>`;
  showModel(p, file);
}

// ---------- routing: #wall = all walls, #wall-6x4 = that model, #clip2 = the clip ----------
function route() {
  const h = (location.hash || "#wall").slice(1), i = h.indexOf("-");
  const id = i < 0 ? h : h.slice(0, i), key = i < 0 ? null : h.slice(i + 1);
  const p = BY[id] || BY.wall; curPart = p.id;
  const ms = models(p), m = ms.length === 1 ? ms[0] : ms.find(x => x[0] === key);
  renderList();
  document.getElementById("v-options").hidden = !!m; document.getElementById("v-model").hidden = !m;
  if (m) renderModel(p, m); else renderOptions(p);
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route); route();
</script>
