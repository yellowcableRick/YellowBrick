<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YellowBrick Parts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eceeea; --panel: #ffffff; --ink: #1f2422; --muted: #5d6661; --line: #d3d8d3; --soft: #f5f6f3;
  --accent: #2b6aa0; --accent-ink: #ffffff; --mat: #26323b; --mat-ink: #d9e1e6;
  /* one hue per group: frame blue, joints green, base amber, drawer purple */
  --c-wall: #9db4cc; --c-bar: #2f6ea6; --c-x: #5fa0dc;
  --c-clip: #3d8b57; --c-end: #6aae7c; --c-staple: #a5d4b0; --c-depth: #22603a;
  --c-tile: #c9932e;
  --c-sledbar: #5b3f99; --c-ledge: #8b6fcc; --c-sled: #c3b2f0; --c-dsled: #a98fe6; --c-usled: #9d86d9; --c-rod: #d9b62f; --c-bundle: #8a73c9;
  --body: "Archivo", "Segoe UI", system-ui, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161a19; --panel: #1f2423; --ink: #e6eae7; --muted: #9ba5a0; --line: #343b39; --soft: #1a1f1e;
    --accent: #6fa6d8; --accent-ink: #0d1a26; --mat: #10171c; --mat-ink: #c9d3d9; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #161a19; --panel: #1f2423; --ink: #e6eae7; --muted: #9ba5a0; --line: #343b39; --soft: #1a1f1e;
  --accent: #6fa6d8; --accent-ink: #0d1a26; --mat: #10171c; --mat-ink: #c9d3d9; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 18px 16px 40px; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; }
.wrap > * { min-width: 0; }
h1 { grid-column: 1 / -1; margin: 0; font-size: 21px; font-weight: 700; font-stretch: 118%; letter-spacing: -0.01em; }
h1 small { font-weight: 450; font-stretch: 100%; color: var(--muted); font-size: 14px; margin-left: 8px; letter-spacing: 0; }
nav summary { display: none; }
nav details > div { display: block; }
.matrix td a { position: relative; }
.matrix th .sm { display: none; }
.matrix td a.two b { white-space: normal; line-height: 1.05; }
nav h3 { margin: 4px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
nav ul + h3 { margin-top: 14px; }
nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 15px; }
nav a:hover { background: var(--panel); }
nav a[aria-current="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
nav a em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 13px; font-weight: 450; }
.sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
main { display: flex; flex-direction: column; gap: 14px; }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.head h2 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 700; font-stretch: 116%; }
.head p { margin: 0; color: var(--muted); }
.back { color: var(--accent); text-decoration: none; font-size: 14px; }
.back:hover { text-decoration: underline; }
.desc { margin: 0; color: var(--muted); max-width: 70ch; }
/* option grid */
.matrix { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto; }
.matrix table { border-collapse: separate; border-spacing: 6px; }
.matrix th { font-weight: 550; color: var(--muted); font-size: 13px; padding: 0 4px; white-space: nowrap; }
.matrix th.ax { text-align: left; color: var(--ink); }
.matrix td a, .row a { display: grid; place-items: center; min-width: 58px; height: 48px; padding: 4px 8px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--soft); color: var(--ink); text-decoration: none; line-height: 1.2; text-align: center; }
.matrix td a b, .row a b { font-weight: 650; font-size: 15px; }
.matrix td a span, .row a span { color: var(--muted); font-size: 11.5px; }
.matrix td a:hover, .row a:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.row a.wide { min-width: 220px; height: auto; padding: 12px 16px; justify-items: start; text-align: left; }
.row a.wide span { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
/* model */
.stage { position: relative; background: var(--mat); border-radius: 14px; overflow: hidden; height: min(66vh, 620px); min-height: 320px; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mat-ink); pointer-events: none; text-align: center; padding: 20px; }
.msg[hidden] { display: none; }
.scale { position: absolute; right: 14px; bottom: 12px; color: var(--mat-ink); font-size: 12.5px; opacity: .85; pointer-events: none; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.fact b { display: block; font-size: 19px; font-weight: 650; font-stretch: 108%; }
.fact span { color: var(--muted); font-size: 13px; }
.dl { display: flex; flex-direction: column; justify-content: center; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 14px; text-decoration: none; font-weight: 650; font-size: 17px; }
.dl span { font-weight: 400; font-size: 12.5px; opacity: .85; word-break: break-all; }
.dl:hover { filter: brightness(1.08); }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.ctl label { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--muted); }
.ctl select { font: inherit; font-size: 15px; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.ctl input[type=range] { width: 140px; accent-color: var(--accent); margin: 8px 0 6px; }
.ctl .note { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
button.dl { border: 0; cursor: pointer; font: inherit; font-weight: 650; font-size: 17px; text-align: left; }
button.dl[disabled] { opacity: .6; cursor: progress; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: end; }
.seg button { font: inherit; font-size: 14px; padding: 6px 12px; border: 0; background: var(--soft); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.plist td a[download] { color: var(--accent); }
.tt { margin: 10px 0 0; font-size: 17px; font-weight: 650; display: flex; gap: 10px; align-items: baseline; }
.tt span { font-weight: 400; font-size: 14px; color: var(--muted); }
.plist { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; }
.plist table { width: 100%; border-collapse: collapse; }
.plist th, .plist td { padding: 7px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
.plist tr:last-child td { border-bottom: 0; }
.plist th { color: var(--muted); font-weight: 550; font-size: 12.5px; }
.plist td.n, .plist th.n { text-align: right; }
.plist td a { color: var(--ink); text-decoration: none; display: inline-flex; gap: 8px; align-items: center; }
.plist td a:hover { color: var(--accent); text-decoration: underline; }
[hidden] { display: none !important; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; }
  nav h3, nav ul + h3 { margin: 0; }
  nav ul { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  nav a { white-space: nowrap; padding: 5px 9px; font-size: 14px; background: var(--panel); border: 1px solid var(--line); }
  nav a[aria-current="true"] { box-shadow: none; border-color: var(--accent); }
  nav a em { display: none; }
  .stage { height: 52vh; }
  nav details > div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; }
  .matrix { padding: 8px; overflow-x: visible; }
  .matrix table { border-spacing: 3px; width: 100%; table-layout: fixed; }
  .matrix th { padding: 0; font-size: 12.5px; }
  .matrix th.ax { width: 4.2em; }
  .matrix td a { min-width: 0; height: 40px; padding: 2px; }
  .matrix td a b { font-size: 14px; white-space: nowrap; }
  .matrix td a.two b { white-space: normal; }
  .matrix td a span { display: none; }
  .matrix th .u, .matrix th .lg { display: none; }
  .matrix th .sm { display: inline; }
  .wrap { gap: 14px; }
}
@media (max-width: 720px) { .facts { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) {
  nav summary { display: flex; align-items: center; gap: 10px; list-style: none; cursor: pointer; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-weight: 600; }
  nav summary::-webkit-details-marker { display: none; }
  nav summary::after { content: "▾"; margin-left: 6px; color: var(--muted); }
  nav details[open] summary::after { content: "▴"; }
  nav summary em { margin-left: auto; font-style: normal; font-weight: 450; font-size: 13px; color: var(--muted); }
  nav details > div { padding-top: 10px; padding-top: 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; }
}
@media (max-width: 480px) {
  .wrap { padding: 12px 10px 32px; }
  .matrix { padding: 6px; }
  .matrix table { border-spacing: 2px; }
  .matrix td a { height: 36px; border-radius: 7px; }
  .matrix td a b { font-size: 12.5px; letter-spacing: -0.02em; }
  .head h2 { font-size: 22px; }
  .fact b { font-size: 16px; }
}
</style>
</head>

  if (p.variants) return p.variants.map(v => [v[0], v[1], p.name + ", " + lc(v[2])]);
  if (p.tables) return p.tables.flatMap(t => t.axes[1][1].flatMap(y => t.axes[0][1].map(x => [`${t.key}${x}x${y}`, `${t.file}_${x}x${y}`, `${p.name}, ${lc(t.name)} ${x} × ${y} BU`])));
  const [a, b] = p.axes;
  if (!b) return a[1].map(x => [String(x), `${p.id}_${x}`, `${p.name} ${x} BU`]);
  const out = []; for (const y of b[1]) for (const x of a[1]) out.push([`${x}x${y}`, `${p.id}_${x}x${y}`, `${p.name} ${x} × ${y} BU`]); return out;
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (n, d) => n.toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const mm = v => fmt(v, v % 1 ? 1 : 0);
const label = (p, file) => { const s = file.split("_")[1]; return p.name + (s ? " " + s.replace("x", " × ") + " BU" : ""); };

// ---------- list ----------
let curPart = "wall", curFile = null;
const NARROW = matchMedia("(max-width: 600px)"), navd = document.getElementById("navd");
function syncNav() { navd.open = !NARROW.matches; }
NARROW.addEventListener("change", syncNav);
document.getElementById("list").addEventListener("click", e => { if (e.target.closest("a") && NARROW.matches) navd.open = false; });
function renderList() {
  const groups = [...new Set(PARTS.map(p => p.group))];
  const li = (id, col, name, n, unit) => `<li><a href="#${id}"${id === curPart ? ' aria-current="true"' : ""}><span class="sw" style="background:var(${col})"></span>${name}<em>${n} ${n === 1 ? unit : unit + "s"}</em></a></li>`;
  document.getElementById("list").innerHTML = groups.map(g => `<h3>${g}</h3><ul>${PARTS.filter(p => p.group === g).map(p => li(p.id, p.col, p.name, models(p).length, "model")).join("")}</ul>`).join("")
    + `<h3>Modules</h3><ul>${MODULES.map(m => li(m.id, m.col, m.name, vars(m).reduce((a, v) => a + nSizes(v), 0), "size")).join("")}</ul>`;
  const cur = BY[curPart] || MBY[curPart]; document.getElementById("navsum").innerHTML = `<span class="sw" style="background:var(${cur ? cur.col : "--c-wall"})"></span>${cur ? cur.name : "Library"}<em>all parts and modules</em>`;
}

// ---------- options ----------
function cell(p, key, big, small) { return `<a href="#${p.id}-${key}"><b>${big}</b><span>${small}</span></a>`; }
function sizeTable(axes, href, fill) {          // fill(x, y): what fits (shown big), "" = just the size, null = nothing fits
  const [[ax, xs], [ay, ys]] = axes;
  return `<div class="matrix"><table><thead><tr><th class="ax"><span class="lg">${ay} ↓ · ${ax} →</span><span class="sm">${ay[0]}↓ ${ax[0]}→</span></th>${xs.map(x => `<th scope="col">${x}<span class="u"> BU</span></th>`).join("")}</tr></thead><tbody>`
    + ys.map(y => `<tr><th scope="row">${y}<span class="u"> BU</span></th>${xs.map(x => { const f = fill(x, y); if (f == null) return "<td></td>";
        const size = `${x} × ${y}`, two = f && f.includes("<wbr>"); return `<td><a href="${href(x, y)}"${two ? ' class="two"' : ""} title="${size} BU${f ? " · " + f.replace("<wbr>", "") : ""}"><b>${f || size.replace(/ /g, "")}</b><span>${f ? size : "BU"}</span></a></td>`; }).join("")}</tr>`).join("") + "</tbody></table></div>";
}
const tableHead = t => `<h3 class="tt">${t.name}<span>${t.sub}</span></h3>`;
function renderOptions(p) {
  const ms = models(p), n = ms.length;
  let body;
  if (p.tables) body = p.tables.map(t => tableHead(t) + sizeTable(t.axes, (x, y) => `#${p.id}-${t.key}${x}x${y}`, (x, y) => fillText(t.fill, `${x}x${y}`, true) || null)).join("");
  else if (p.variants) body = `<div class="row">${p.variants.map(v => `<a class="wide" href="#${p.id}-${v[0]}"><b>${v[2]}</b><span>${v[3]}</span></a>`).join("")}</div>`;
  else if (p.axes.length === 2) {
    body = sizeTable(p.axes, (x, y) => `#${p.id}-${x}x${y}`, (x, y) => p.fill ? (fillText(p.fill, `${x}x${y}`, true) || null) : "");
  } else body = `<div class="row">${p.axes[0][1].map(x => cell(p, String(x), `${x} BU`, `${mm(MAN[`${p.id}_${x}`].size[0])} mm`)).join("")}</div>`;
  document.getElementById("v-options").innerHTML = `<div class="head"><h2>${p.name}</h2><p>${n} models · choose one${p.fill ? (p.fill === "drawer" ? " · in each: the grid in Gridfinity units (42 mm)" : " · in each: the boxes that fit") : p.tables ? " · in each: the boxes that fit" : ""}</p></div><p class="desc">${p.desc}</p>${body}`;
}

function renderModuleOptions(M) {
  const vs = vars(M), n = vs.reduce((a, v) => a + nSizes(v), 0), hs = vs[0].axes[2][1];
  const body = vs.map(V => (V.name ? tableHead(V) : "") + sizeTable(V.axes, (x, y) => `#${M.id}-${V.key}${x}x${y}x${V.axes[2][1][0]}`, (x, y) => fillText(V.data, `${x}x${y}`, true) || null)).join("");
  document.getElementById("v-options").innerHTML = `<div class="head"><h2>${M.name}</h2><p>${n} sizes · choose width and depth, ${hs.length > 1 ? `then the height (${hs[0]}–${hs[hs.length - 1]} BU)` : `height ${hs[0]} BU`}${vs[0].data === "drawer" ? " · in each: the grid in Gridfinity units (42 mm)" : vs[0].data === "bundle" ? " · in each: the bundles that fit" : vs[0].data === "clue" ? " · in each: the boxes that fit, ↔ across or ↕ straight" : " · in each: the boxes that fit"}</p></div><p class="desc">${M.desc}</p>${body}`;
}

// ---------- 3D ----------
const host = document.getElementById("stage");
let R, S, C, O, obj = null, grid = null, want = "";
function initView() {
  if (R) return;
  R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(2, devicePixelRatio || 1)); host.prepend(R.domElement);
  S = new THREE.Scene(); S.background = new THREE.Color(css("--mat"));
  S.add(new THREE.HemisphereLight(0xffffff, 0x3a4650, 0.85));
  const l1 = new THREE.DirectionalLight(0xffffff, 0.75); l1.position.set(0.6, 1, 0.8); S.add(l1);
  const l2 = new THREE.DirectionalLight(0xffffff, 0.25); l2.position.set(-0.8, 0.3, -0.6); S.add(l2);
  C = new THREE.PerspectiveCamera(26, 1, 1, 20000);
  O = new THREE.OrbitControls(C, R.domElement); O.enableDamping = true; O.dampingFactor = 0.12;
  const size = () => { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; R.setSize(w, h, false); C.aspect = w / h; C.updateProjectionMatrix(); };
  new ResizeObserver(size).observe(host); size();
  (function loop() { requestAnimationFrame(loop); if (!document.getElementById("v-model").hidden) { O.update(); R.render(S, C); } })();
}
const cache = {}, loader = new THREE.GLTFLoader();
function load(file) {
  if (!cache[file]) {
    cache[file] = new Promise((res, rej) => loader.load("models/" + file + ".glb", g => res(g.scene), undefined, rej));
    cache[file].catch(() => { delete cache[file]; });
  }
  return cache[file];
}
async function showModel(p, file) {
  initView(); want = file;
  const msg = document.getElementById("msg"); msg.textContent = "Loading…"; msg.hidden = false;
  if (obj) { S.remove(obj); obj = null; } if (grid) { S.remove(grid); grid = null; }
  let scene;
  try { scene = await load(file); } catch (e) { if (want === file) msg.textContent = "This model didn't load. Check your connection and open it again."; return; }
  if (want !== file) return;
  msg.hidden = true;
  obj = scene.clone(true);
  const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(css(p.col)), roughness: 0.6, metalness: 0.02, flatShading: true });
  obj.traverse(o => { if (o.isMesh) { if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); o.material = m; } });
  S.add(obj); frame(obj);
}
function frame(o) {
  const box = new THREE.Box3().setFromObject(o), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
  const span = Math.ceil((Math.max(sz.x, sz.z) + 64) / 32) * 32;
  grid = new THREE.GridHelper(span, span / 32, 0x8696a3, 0x4a5966); grid.position.set(c.x, box.min.y - 0.5, c.z); S.add(grid);
  const r = Math.max(sz.length() / 2, 12), fov = C.fov * Math.PI / 180, dist = r / Math.sin(Math.min(fov, fov * C.aspect) / 2) * 1.08;
  O.target.copy(c); C.position.copy(c).add(new THREE.Vector3(0.95, 0.65, 1.15).normalize().multiplyScalar(dist));
  C.near = dist / 100; C.far = dist * 20; C.updateProjectionMatrix();
}
function renderModel(p, m) {
  document.getElementById("ctl").hidden = true; document.getElementById("plist").hidden = true;
  const [key, file, name] = m, all = models(p).length, info = MAN[file];
  document.getElementById("m-head").innerHTML = (all > 1 ? `<a class="back" href="#${p.id}">All ${all} ${p.name.toLowerCase()} models</a>` : "")
    + `<h2 style="flex-basis:100%">${name}</h2><p class="desc" style="margin:0">${p.desc}</p>`;
  document.getElementById("facts").innerHTML = [
    [info.size.map(mm).join(" × ") + " mm", "size"], [fmt(info.cm3, 2) + " cm³", "volume"], [fmt(info.cm3 * 1.24, 1) + " g", "weight in PLA"]]
    .map(([b, t]) => `<div class="fact"><b>${b}</b><span>${t}</span></div>`).join("")
    + `<a class="dl" href="stl/${file}.stl" download="${file}.stl">Download STL<span>${file}.stl</span></a>`;
  showModel(p, file);
}


// ---------- modules: placed from the part models, nothing stored per module ----------
let MODS = null, modObj = null, modKey = "", modM = null, modV = null, modFiles = null, modCount = null, explodeT = 0, printMode = "parts";
const getMods = () => MODS || (MODS = fetch("modules.json").then(r => { if (!r.ok) throw 0; return r.json(); }).catch(e => { MODS = null; throw e; }));
const mats = {};
const matFor = file => { const p = partOf(file)[0]; return mats[p.id] || (mats[p.id] = new THREE.MeshStandardMaterial({ color: new THREE.Color(css(p.col)), roughness: 0.6, metalness: 0.02, flatShading: true })); };
function renderModule(M, V, k) {
  const key = V.key + k, [w, d, h] = k.split("x").map(Number), sel = (ax, v) => `<label>${ax[0]}<select data-ax="${ax[0]}">${ax[1].map(x => `<option value="${x}"${x === v ? " selected" : ""}>${x} BU</option>`).join("")}</select></label>`;
  const nAll = vars(M).reduce((a, v) => a + nSizes(v), 0), fl = fillText(V.data, `${w}x${d}`);
  document.getElementById("m-head").innerHTML = `<a class="back" href="#${M.id}">All ${nAll} sizes</a><h2 style="flex-basis:100%">${M.name}${V.name ? ", " + lc(V.name) : ""} ${w} × ${d} × ${h} BU</h2><p class="desc" style="margin:0">${!fl ? "" : V.data === "drawer" ? `Gridfinity: ${FILL.drawer[`${w}x${d}`]} units (42 mm). ` : `Holds ${fl}. `}${M.desc}</p>`;
  const ctl = document.getElementById("ctl"); ctl.hidden = false;
  ctl.innerHTML = (M.variants ? `<label>Orientation<select id="orient">${M.variants.map(v => `<option value="${v.key}"${v === V ? " selected" : ""}>${v.name}</option>`).join("")}</select></label>` : "")
    + sel(V.axes[0], w) + sel(V.axes[1], d) + sel(V.axes[2], h)
    + `<label>Explode<input type="range" id="explode" min="0" max="100" value="${explodeT * 100}"></label>`
    + `<div class="seg" role="radiogroup" aria-label="Print as">${[["parts", "Parts"], ["one", "One print"]].map(([v, t]) => `<button role="radio" data-mode="${v}" aria-checked="${printMode === v}">${t}</button>`).join("")}</div>`;
  ctl.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { printMode = b.dataset.mode; ctl.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-checked", x === b)); applyMode(); });
  ctl.querySelectorAll("select[data-ax]").forEach(e => e.onchange = () => { const v = [...ctl.querySelectorAll("select[data-ax]")].map(x => x.value); location.hash = `${M.id}-${V.key}${v.join("x")}`; });
  const o = document.getElementById("orient");
  if (o) o.onchange = () => { const N = M.variants.find(v => v.key === o.value), dims = [w, d, h].map((x, j) => N.axes[j][1].includes(x) ? x : N.axes[j][1][0]); location.hash = `${M.id}-${N.key}${dims.join("x")}`; };
  document.getElementById("explode").oninput = e => { explodeT = e.target.value / 100; explode(); };
  document.getElementById("facts").innerHTML = ""; document.getElementById("plist").hidden = true;
  modV = V; showModule(M, key);
}
async function showModule(M, key) {
  initView(); want = M.id + key; modKey = key;
  const msg = document.getElementById("msg"); msg.textContent = "Loading…"; msg.hidden = false;
  if (obj) { S.remove(obj); obj = null; } if (grid) { S.remove(grid); grid = null; }
  let L;
  try { L = (await getMods())[modV.data || M.id][key.slice(modV.key.length)]; await Promise.all([...new Set(L.map(x => x[0]))].map(load)); }
  catch (e) { if (want === M.id + key) msg.textContent = "This module didn't load. Check your connection and open it again."; return; }
  if (want !== M.id + key) return;
  const root = new THREE.Group(), count = {};
  for (const [file, ...m] of L) {
    const inner = new THREE.Group(); inner.position.set(m[0], m[1], m[2]); inner.rotation.y = m[3] * Math.PI / 180;
    const g = (await load(file)).clone(true), c = MAN[file].c; g.position.set(c[0], c[1], c[2]);
    g.traverse(o => { if (o.isMesh) { if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals(); o.material = matFor(file); } });
    inner.add(g); const outer = new THREE.Group(); outer.add(inner); outer.userData.file = file; outer.userData.loose = isLoose(M, file); root.add(outer);
    count[file] = (count[file] || 0) + 1;
  }
  root.updateMatrixWorld(true);
  const mb = new THREE.Box3().setFromObject(root), mc = mb.getCenter(new THREE.Vector3());
  root.children.forEach(o => { const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
    o.userData.dir = o.userData.loose ? new THREE.Vector3(0, 0.15, 1.1).multiplyScalar(mb.max.z - mb.min.z) : c.sub(mc).multiplyScalar(0.9); });
  msg.hidden = true; obj = modObj = root; modM = M; S.add(root); frame(root);
  const vi = f => { const p = partOf(f)[0]; return p.variants ? p.variants.findIndex(v => v[1] === f) : 0; };
  modFiles = Object.keys(count).sort((a, b) => PARTS.indexOf(partOf(a)[0]) - PARTS.indexOf(partOf(b)[0]) || vi(a) - vi(b) || a.localeCompare(b, "en", { numeric: true }));
  modCount = count; applyMode();
}
const isLoose = (M, file) => ((modV || M).loose || []).includes(file.split("_")[0]);
const oneMat = new THREE.MeshStandardMaterial({ color: 0xc9cdd2, roughness: 0.6, metalness: 0.02, flatShading: true });
function partName(f) { const [p] = partOf(f), s = f.split("_")[1], v = p.variants ? p.variants.find(v => v[1] === f) : null;
  if (p.tables) { const t = p.tables.find(t => t.file === f.split("_")[0]); return `${p.name}, ${lc(t.name)} ${s.replace("x", " × ")} BU`; }
  return p.name + (v ? ", " + lc(v[2]) : s ? " " + s.replace("x", " × ") + " BU" : ""); }
function applyMode() {
  if (!modObj) return;
  const M = modM, key = modKey, one = printMode === "one", count = modCount, files = modFiles;
  modObj.children.forEach(o => { const m = one && !o.userData.loose ? oneMat : matFor(o.userData.file); o.traverse(x => { if (x.isMesh) x.material = m; }); });
  explode();
  const sz = new THREE.Box3().setFromObject(modObj).getSize(new THREE.Vector3()), n = files.reduce((a, f) => a + count[f], 0);
  const fixed = files.filter(f => !isLoose(M, f)), loose = files.filter(f => isLoose(M, f));
  const cm = fs => fs.reduce((a, f) => a + MAN[f].cm3 * count[f], 0), cm3 = cm(files);
  const fact = ([b, t]) => `<div class="fact"><b>${b}</b><span>${t}</span></div>`;
  const row = f => { const [p, href] = partOf(f);
    return `<tr><td><a href="${href}"><span class="sw" style="background:var(${p.col})"></span>${partName(f)}</a></td><td class="n">${count[f]}</td><td class="n">${fmt(MAN[f].cm3, 2)}</td><td class="n"><a href="stl/${f}.stl" download="${f}.stl">STL</a></td></tr>`; };
  const head = t => `<tr><th>${t}</th><th class="n">Count</th><th class="n">cm³ each</th><th class="n"></th></tr>`;
  if (!one) {
    document.getElementById("facts").innerHTML = [[`${mm(sz.x)} × ${mm(sz.z)} × ${mm(sz.y)} mm`, "size"], [`${n} parts`, `${files.length} different prints`], [fmt(cm3, 0) + " cm³ · " + fmt(cm3 * 1.24, 0) + " g", "all parts, in PLA"]].map(fact).join("");
    document.getElementById("plist").innerHTML = `<table><thead>${head("Part")}</thead><tbody>${files.map(row).join("")}</tbody></table>`;
  } else {
    const fc = cm(fixed);
    document.getElementById("facts").innerHTML = [[`${mm(sz.x)} × ${mm(sz.z)} × ${mm(sz.y)} mm`, "size"], [fmt(fc, 0) + " cm³ · " + fmt(fc * 1.24, 0) + " g", `one print: ${fixed.reduce((a, f) => a + count[f], 0)} parts in place`]].map(fact).join("")
      + `<button class="dl" id="mstl">Download the one print<span>${M.id}_${key}.stl, without the loose ${loose.length === 1 ? "item" : "items"}</span></button>`;
    document.getElementById("mstl").onclick = () => exportSTL(M, key);
    document.getElementById("plist").innerHTML = `<table><thead>${head("Printed separately")}</thead><tbody>${loose.map(row).join("")}</tbody></table>`
      + `<table style="margin-top:10px"><thead>${head("In the one print")}</thead><tbody>${fixed.map(f => row(f).replace(/<td class="n"><a href="stl[^<]*<\/a><\/td>/, '<td class="n"></td>')).join("")}</tbody></table>`;
  }
  document.getElementById("plist").hidden = false;
}
function explode() { if (!modObj) return; const one = printMode === "one"; modObj.children.forEach(o => o.position.copy(o.userData.dir).multiplyScalar(one && !o.userData.loose ? 0 : explodeT)); }
function exportSTL(M, key) {
  if (!modObj || modKey !== key) return;
  const b = document.getElementById("mstl"); b.disabled = true;
  setTimeout(() => {
    const t = explodeT; explodeT = 0; explode();
    const g = new THREE.Group(); g.rotation.x = Math.PI / 2; const c = modObj.clone(true); c.children.filter(o => o.userData.loose).forEach(o => c.remove(o)); g.add(c); g.updateMatrixWorld(true);   // back to z up; the loose items are printed on their own
    const data = new THREE.STLExporter().parse(g, { binary: true });
    explodeT = t; explode();
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "model/stl" })); a.download = `${M.id}_${key}.stl`;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); b.disabled = false;
  }, 30);
}

// ---------- routing: #wall = all walls, #wall-6x4 = that model, #drawer-3x3x2 = a module ----------
function route() {
  const h = (location.hash || "#wall").slice(1), i = h.indexOf("-");
  const id = i < 0 ? h : h.slice(0, i), key = i < 0 ? null : h.slice(i + 1);
  if (MBY[id]) {
    const M = MBY[id], r = resolve(M, key);
    curPart = id; renderList(); modObj = null;
    document.getElementById("v-options").hidden = !!r; document.getElementById("v-model").hidden = !r;
    if (r) renderModule(M, r[0], r[1]); else renderModuleOptions(M);
    window.scrollTo({ top: 0 }); return;
  }
  modObj = null;
  const p = BY[id] || BY.wall; curPart = p.id;
  const ms = models(p), m = ms.length === 1 ? ms[0] : ms.find(x => x[0] === key);
  renderList();
  document.getElementById("v-options").hidden = !!m; document.getElementById("v-model").hidden = !m;
  if (m) renderModel(p, m); else renderOptions(p);
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", route); syncNav(); route();
</script>
